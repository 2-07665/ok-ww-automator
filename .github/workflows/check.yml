name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.13"
          python-version: "3.12"
      - run: uv run --locked python -m unittest discover -s tests
        env:
          # Exercise redirected output on non-UTF-8 Windows installations.
          PYTHONIOENCODING: ${{ runner.os == 'Windows' && 'cp1252' || 'utf-8' }}
